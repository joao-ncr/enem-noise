[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enemnoise"
version = "0.1.0"
description = "Modelagem estatística das discrepâncias de nota na redação do ENEM (Monte Carlo, API, paradoxos)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8", "pyyaml>=6.0",
                "fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.90", "httpx>=0.26"]

[project.scripts]
enemnoise = "enemnoise.cli:main"

[tool.setuptools.packages.find]
include = ["enemnoise*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
